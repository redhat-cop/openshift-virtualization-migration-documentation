name: Deploy PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: read

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'

      - name: Install Antora
        run: npm i antora @antora/lunr-extension

      - name: Generate Site
        run: npx antora antora-playbook.yml

      - name: Test search and navigation
        run: node --test tests/

      - name: Disable Jekyll in preview
        run: touch build/site/.nojekyll

      - name: Upload site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: build/site
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event.action == 'closed') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        if: github.event.action != 'closed'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download site
        if: github.event.action != 'closed'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site
          path: build/site

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1
        with:
          source-dir: ./build/site
          preview-branch: gh-pages
