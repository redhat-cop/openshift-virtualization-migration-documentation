name: Publish to GitHub Pages v2
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://redhat-cop.github.io/openshift-virtualization-migration-documentation/
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '18'
      - name: Install Antora
        run: npm i antora @antora/lunr-extension
      - name: Generate Site
        run: npx antora antora-playbook.yml
      - name: Test search and navigation
        run: node --test tests/
      - name: Disable Jekyll
        run: touch build/site/.nojekyll
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: build/site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
